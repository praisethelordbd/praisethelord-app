name: praisethelord
description: "Praise & Worship App"
publish_to: 'none'

version: 1.0.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0
  provider: ^6.1.2
  wakelock_plus: ^1.2.0
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.2
  cupertino_icons: ^1.0.6
  sqflite_common_ffi: ^2.3.3
  sqflite_common_ffi_web: ^1.0.1+1
  package_info_plus: ^9.0.0
  http: ^1.5.0
  dio: ^5.9.0
  open_filex: ^4.7.0
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^4.0.0
  gh_pages: ^0.1.1 # <--- এখানে পরিবর্তন করা হয়েছে

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/database/
    - assets/icon/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 48