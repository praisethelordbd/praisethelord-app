# -----------------------------------------------------------------
# এই ফাইলটি পরিষ্কার এবং অপটিমাইজ করা হয়েছে
# -----------------------------------------------------------------

# Gradle JVM-এর জন্য সর্বোচ্চ ৪ জিবি র‍্যাম এবং অন্যান্য অপটিমাইজেশন
# এটি বেশিরভাগ কম্পিউটারের জন্য একটি নিরাপদ এবং কার্যকর সেটিং
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8

# AndroidX এবং Jetifier এনাবল রাখা হয়েছে
android.useAndroidX=true
android.enableJetifier=true

# Kotlin Daemon-এর জন্য মেমোরি (এটি ঠিক আছে)
kotlin.daemon.jvm.options=-Xmx2g

# বিল্ড পারফরম্যান্স বাড়ানোর জন্য অতিরিক্ত অপশন (ঐচ্ছিক কিন্তু প্রস্তাবিত)
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
# Gradle-কে সঠিক JDK ব্যবহার করার জন্য পাথ নির্দিষ্ট করা হলো
org.gradle.java.home=C:\\Program Files\\Android\\Android Studio\\jbr